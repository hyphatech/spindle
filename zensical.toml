# Spindle's documentation site, published to GitHub Pages by
# .github/workflows/docs.yml. `make docs` builds it into site/,
# the reference from the .mli files into docs/reference/ first.
#
# Every program a page shows is a file under examples/, built with the
# repository, and included here by pymdownx.snippets -- so a page cannot show
# code that does not compile. check_paths makes a missing one fail the build.

[project]
site_name = "Spindle"
site_description = "The Eio-native web framework for modern OCaml."
site_url = "https://hyphatech.github.io/spindle/"
repo_url = "https://github.com/hyphatech/spindle"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Tutorial" = [
    { "Your first app" = "tutorial/first-app.md" },
    { "Routes" = "tutorial/routes.md" },
    { "Dependencies" = "tutorial/dependencies.md" },
    { "Request bodies, responses and errors" = "tutorial/bodies.md" },
    { "Logging" = "tutorial/logging.md" },
    { "Static files" = "tutorial/static-files.md" },
    { "Database" = "tutorial/database.md" },
    { "OpenAPI" = "tutorial/openapi.md" },
    { "Client schemas" = "tutorial/client-schemas.md" },
  ] },
  { "Guides" = [
    { "HTML pages and templates" = "guide/pages.md" },
    { "Cookies, sessions and CORS" = "guide/cookies.md" },
    { "Middleware" = "guide/middleware.md" },
    { "Server-Sent Events" = "guide/streams.md" },
    { "WebSockets" = "guide/websockets.md" },
    { "HTTP client" = "guide/client.md" },
    { "Background jobs" = "guide/background.md" },
    { "Rate limits" = "guide/rate-limits.md" },
    { "Compression" = "guide/compression.md" },
    { "Testing" = "guide/testing.md" },
    { "Server configuration and shutdown" = "guide/serving.md" },
    { "Multicore and shared state" = "guide/domains.md" },
    { "Health checks" = "guide/health.md" },
    { "Metrics" = "guide/metrics.md" },
  ] },
  { "Reference" = "reference.md" },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
# The header's mark is an icon, not theme.logo's image, so its needle takes
# the header's colour in either scheme.
custom_dir = "overrides"
icon.logo = "spindle/mark"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
smarty = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["examples"]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
