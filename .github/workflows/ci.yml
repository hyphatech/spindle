# Checks are defined in the Makefile. 5.5 is the supported minimum.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["5.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-repositories: |
            hypha: https://github.com/hyphatech/opam-repository.git
            default: https://opam.ocaml.org
      # The printed Melange client's suite runs on Bun, and so does the OAuth
      # suite's authorization server.
      - uses: oven-sh/setup-bun@v2
      - run: opam install . --deps-only --with-test --with-dev-setup -y
      # Use setup-ocaml's switch instead of the Makefile's.
      - run: make lint OPAM="opam exec --"
      # Compose reaches Podman through its user socket, which the runner
      # does not start.
      - run: systemctl --user start podman.socket
      # The Postgres of compose.yaml, as on a laptop, so CI tests the
      # database every contributor does.
      - run: make test OPAM="opam exec --"

  # macOS, on Apple silicon and Intel, where Eio runs on another backend
  # than Linux's: what a socket or a file does differs there, and one
  # system's run proves nothing of the other's. The runners have no Podman,
  # so the database suites skip, saying so, and are Linux's to run.
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-repositories: |
            hypha: https://github.com/hyphatech/opam-repository.git
            default: https://opam.ocaml.org
      - uses: oven-sh/setup-bun@v2
      - run: opam install . --deps-only --with-test -y
      - run: cd test/oidc && bun install --frozen-lockfile
      - run: SPINDLE_TEST_OIDC=$PWD/test/oidc opam exec -- dune test --force

  # The oldest versions the opam file allows, as opam-repository checks.
  lower-bounds:
    runs-on: ubuntu-24.04
    env:
      OPAMCRITERIA: +removed,+count[version-lag,solution]
      OPAMFIXUPCRITERIA: +removed,+count[version-lag,solution]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-repositories: |
            hypha: https://github.com/hyphatech/opam-repository.git
            default: https://opam.ocaml.org
      # The printed Melange client's suite runs on Bun, and so does the OAuth
      # suite's authorization server.
      - uses: oven-sh/setup-bun@v2
      - run: opam install . --deps-only --with-test -y
      - run: opam list --installed --columns=name,version
      - run: opam exec -- dune build -p spindle-http,spindle-client,spindle,spindle-mcp-client,spindle-mcp,spindle-postgres,spindle-sqlite,spindle-cli @install
      # Compose reaches Podman through its user socket, which the runner
      # does not start.
      - run: systemctl --user start podman.socket
      - run: make test OPAM="opam exec --"
